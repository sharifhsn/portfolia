[[experiments]]
slug = "cugen-layout"
name = "CuGen data layout study"
category = "numbers"
status = "study"
summary = "Four tiny values, one byte, and an exact round trip."
interest = "I am interested in how data layout shapes the cost of genomic calculations. Compact values and predictable access can matter as much as the arithmetic, especially when a GPU processes a large dataset."
progress = "The independent Rust example packs four two-bit values into one byte and checks every possible packed byte. It does not implement the CuGen format or execute a GPU kernel. My specific upstream contribution still needs confirmation."
question = "What does a compact two-bit representation look like?"
scope = "The page implements an independent two-bit example. It does not implement the CuGen format or run a GPU kernel."
demo_plan = "Choose a synthetic vector and inspect its encoded byte and recovered values."
next_step = "Identify the accepted CuGen contribution and compare one actual format record."
rust_plan = "Rust encodes and decodes the small fixture. All 256 possible bytes have a round-trip check."
credit = "CuGen is upstream genomics software. This new data-layout study makes no authorship or performance claim."
phase = 3
