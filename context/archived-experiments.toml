name = "System Health for Codex"
category = "tools"
status = "study"
summary = "Give coding agents a clear view of the resources they use."
interest = "A coding agent starts builds, opens processes, and fills storage on the same computer I use. I want it to account for that cost. A CPU number needs its sample time beside it, and missing data needs an explicit state. Otherwise a tidy panel turns an old reading into a misleading picture of the machine."
progress = "The Python and TypeScript plugin includes a shared sampler, a Codex panel, process and storage views, and settings. The Rust example below shows how the panel distinguishes current, stale, and missing measurements. Its host values are synthetic."
question = "How does a resource panel distinguish a fresh measurement from an old one?"
scope = "Synthetic CPU, memory, and disk samples demonstrate the measurement states. Python and TypeScript implement the host plugin."
demo_plan = "Switch between current, stale, and missing CPU samples and inspect the value and age together."
next_step = "Connect a public metrics sample from the plugin to the same value-and-age checks."
rust_plan = "Rust validates sample values and ages. HTML controls select the measurement state."
credit = "A personal Codex plugin experiment."
demo_href = "/experiments/system-health/#demo"

