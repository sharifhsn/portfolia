[[experiments]]
slug = "browser-model"
name = "A very small language model"
category = "knowledge"
status = "available"
summary = "A 30-million-parameter model that answers on your device."
interest = "How little model can I put on a website and still get something useful? A tiny model makes download size, local execution, and limited capability visible enough to experiment with directly."
