category = "languages"
status = "study"
summary = "An old compiler idea with a deliberately small target."
interest = "I wondered whether Rust’s intermediate representation could reach Swift’s compiler infrastructure. The .NET backend suggested a similar question for Swift SIL: which parts of a Rust program survive that boundary?"
