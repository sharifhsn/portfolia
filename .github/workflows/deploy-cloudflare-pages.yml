name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Typst 0.15.1
        run: |
          typst_archive="$RUNNER_TEMP/typst.tar.xz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz" \
            --output "$typst_archive"
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $typst_archive" | sha256sum --check
          tar -xJf "$typst_archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" --version
      - name: Prepare browser chat assets
        run: |
          npm ci
          npm run build:chat-runtime
          ./scripts/fetch-chat-model.sh
          ./scripts/build-hornet-wasm.sh
      - name: Build static site
        run: cargo run --locked --release -- --export-static
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=portfolia --branch=main
