<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ resume.name }}'s Portfolio</title>
    <link href="/static/css/output.css" rel="stylesheet">
</head>
<body class="bg-slate-200 text-slate-800 font-sans">
    <header class="bg-slate-800 shadow-md sticky top-0 z-50 text-white">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold">{{ resume.name }}</a>
            <div class="flex space-x-4">
                <a href="/education" class="hover:text-slate-300">Education</a>
                <a href="/projects" class="hover:text-slate-300">Projects</a>
                <a href="/experience" class="hover:text-slate-300">Experience</a>
                <a href="/leadership" class="hover:text-slate-300">Leadership</a>
                <a href="/skills" class="hover:text-slate-300">Skills</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-800 mt-8 py-4 text-white">
        <div class="container mx-auto px-6 text-center">
            <p>&copy; 2025 {{ resume.name }}. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
