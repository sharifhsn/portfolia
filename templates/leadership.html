{% extends "base.html" %}

{% block content %}
<section id="leadership" class="mb-8 scroll-mt-16">
    <h2 class="text-3xl font-bold mb-4 border-b-4 border-slate-500 pb-2 dark:text-slate-100">Leadership & Extracurricular Experience</h2>
    {% for item in resume.leadership %}
        <div class="bg-white p-6 rounded-lg shadow-lg mb-4 transition-colors duration-500 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-2xl font-bold text-slate-700 dark:text-slate-100">{{ item.organization }}</h3>
                <p class="text-slate-600 dark:text-slate-400">{{ item.location }}</p>
            </div>
            <div class="flex justify-between items-center mb-2">
                <p class="text-xl italic">{{ item.position }}</p>
                <p class="text-slate-600 dark:text-slate-400">{{ item.date }}</p>
            </div>
            {{ item.description | safe }}
        </div>
    {% endfor %}
</section>
{% endblock %}
