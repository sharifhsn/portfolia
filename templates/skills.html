{% extends "base.html" %}

{% block content %}
<section id="skills" class="mb-8 scroll-mt-16">
    <h2 class="text-3xl font-bold mb-4 border-b-4 border-slate-500 pb-2">Skills</h2>
    <div class="bg-white p-6 rounded-lg shadow-lg">
        <h3 class="text-2xl font-bold text-slate-700 mb-2">Technical Skills</h3>
        <div class="flex flex-wrap">
            {% for skill in resume.skills.skills %}
                <span class="bg-sky-200 text-sky-800 text-sm font-medium mr-2 mb-2 px-2.5 py-0.5 rounded-full" title="{{ skill.description }}">{{ skill.name }}</span>
            {% endfor %}
        </div>
        <h3 class="text-2xl font-bold text-slate-700 mt-4 mb-2">Certifications</h3>
        <div class="flex flex-wrap">
            {% for cert in resume.skills.certifications %}
                <span class="bg-emerald-200 text-emerald-800 text-sm font-medium mr-2 mb-2 px-2.5 py-0.5 rounded-full" title="{{ cert.description }}">{{ cert.name }}</span>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
