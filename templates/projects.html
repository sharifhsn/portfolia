{% extends "base.html" %}

{% block content %}
<section id="projects" class="mb-8 scroll-mt-16">
    <h2 class="text-3xl font-bold mb-4 border-b-4 border-slate-500 pb-2 dark:text-slate-100">Projects</h2>
    {% for project in resume.projects %}
        <div class="bg-white p-6 rounded-lg shadow-lg mb-4 transition-colors duration-500 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-2xl font-bold text-slate-700 dark:text-slate-100">{{ project.name }}</h3>
                <p class="text-slate-600 dark:text-slate-400">{{ project.date }}</p>
            </div>
            <p class="text-lg italic text-slate-700 mb-2 dark:text-slate-300">{{ project.technologies }}</p>
            {{ project.description | safe }}
        </div>
    {% endfor %}
</section>
{% endblock %}
