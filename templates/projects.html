{% extends "base.html" %}

{% block content %}
<section id="projects" class="mb-8 scroll-mt-16">
    <h2 class="text-3xl font-bold mb-4 border-b-4 border-slate-500 pb-2">Projects</h2>
    {% for project in resume.projects %}
        <div class="bg-white p-6 rounded-lg shadow-lg mb-4 transition-colors duration-500 hover:bg-slate-200">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-2xl font-bold text-slate-700">{{ project.name }}</h3>
                <p class="text-slate-600">{{ project.date }}</p>
            </div>
            <p class="text-lg italic text-slate-700 mb-2">{{ project.technologies }}</p>
            <ul class="list-disc list-inside text-slate-700">
                {% for item in project.description %}
                    <li>{{ item }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endfor %}
</section>
{% endblock %}
