[package]
name = "portfolia"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.14"
askama-derive-axum = "0.1"
ammonia = "4"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
markdown = "1.0.0"
glob = "0.3.1"
lazy_static = "1.4.0"
toml = "0.8"
