next_step = "Extend the fixture to a second codec behavior. Preserve the selected scope of each comparison."
rust_plan = "The current Rust CLI supplies recorded output. Rust and Askama display the fixture."
credit = "Human-directed, AI-generated work from FFmpeg references. Preserve upstream licenses."
