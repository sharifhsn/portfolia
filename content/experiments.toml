# Display order favors recent work and substantial implementations.

[[experiments]]
slug = "ldsc"
name = "LD Score Regression in Rust"
category = "numbers"
status = "study"
summary = "What can we learn about the genetics of a trait from studies that already exist?"
interest = "LDSC makes published genetic studies useful for more than their original question. It estimates how much variation common genetic variants explain, and whether two traits share genetic influences. The clever part is that correlated variants help separate many small genetic effects from study bias: a variant that tags more neighbors tends to collect more real genetic signal. You need published genome-wide association study (GWAS) summaries and a suitable reference panel, but you don't need the participants' individual genomes. I'm interested in that reuse, and in making the expensive reference calculation fast enough to compare more datasets and settings."
progress = "The Rust engine calculates LD scores, heritability, and genetic correlation, with exact and sketch paths. In a recorded comparison on the same workstation, the exact f64 LD-score step took about 85 seconds instead of nearly 26 minutes, an 18.1× speedup. The page below connects that work to real 1000G output and a published BMI study. The next question is how much time sketching can save without losing accuracy in the final genetic estimates."
question = "How much can published genetic studies reveal without access to individual genomes?"
scope = "The display combines recorded native benchmarks, aggregate chromosome 22 LD scores, and a retained BMI regression result. A separate three-variant example uses synthetic data."
demo_plan = "Compare runtime, examine the 1000G LD-score distribution, and trace the BMI result back to its reference and study inputs."
next_step = "Repeat the full pipeline with fixed inputs and builds, then compare exact and sketch modes on larger panels. Measure the error in heritability and genetic correlation alongside runtime, so the speed tradeoff stays useful for the actual analysis."
rust_plan = "Rust calculates display ratios and SVG charts from saved results at export. The full genotype and regression pipeline stays in the native CLI."
credit = "A Rust reimplementation of the LDSC method and reference software."
demo_href = "/experiments/ldsc/#engine"

[[experiments]]
slug = "rustlyn"
name = "Rustlyn"
category = "languages"
status = "recorded"
summary = "Build C# language intelligence in a native Rust server."
interest = "An editor needs more than syntax highlighting to understand C#. It has to resolve names, track types, load project inputs, and point diagnostics at the right source. Rustlyn brings those problems into a native Rust language server, with managed compatibility at the runtime boundary. The interesting part is how the language semantics become useful editor behavior."
progress = "The repository contains binder, project, and editor infrastructure. The binder example below records an unresolved name, its owning expression, and its exact source range. The next integration connects that semantic result to a live editor and a prepared project."
question = "How does a name-resolution failure become an editor diagnostic?"
scope = "The example shows an unresolved-name result from the native Rustlyn binder and the source range attached to it."
demo_plan = "Inspect the unresolved name, its byte range, and the bound expression that owns the error."
next_step = "Load a prepared project in a live editor and trace its diagnostic back to the binder result."
rust_plan = "The native Rust binder supplies the result. Rust generates the page for inspection."
credit = "Independent work with Roslyn and other language servers as references."
demo_href = "/experiments/rustlyn/#demo"

[[experiments]]
slug = "rust-dotnet"
name = "Rust to .NET"
category = "languages"
status = "recorded"
summary = "Compile Rust to .NET and compare managed execution with native output."
interest = "A compiler backend connects ecosystems at a deeper level than an API wrapper. Translating Rust into .NET brings Rust values and operations into a managed runtime, where libraries and platform services follow a different set of rules. I'm interested in that boundary: what the compiler emits, how the runtime executes it, and where compatibility work belongs."
progress = "My local fork work covers compiler and linker behavior, nightly compatibility, and release checks. The installed SDK compiled a Rust function to a .NET assembly and produced four results equal to native Rust. The recording uses cargo-dotnet 0.0.1 and nightly-2026-06-17. FractalFir supplies the upstream translation backend."
question = "How does the same Rust function behave on native and managed runtimes?"
scope = "A four-input run through the installed Rust-to-.NET SDK compares managed output with native Rust."
demo_plan = "Inspect the Rust source, generated assembly identity, and execution results."
next_step = "Repeat the same inputs with a build from the newer source checkout and compare the assembly and execution results."
rust_plan = "The Rust compiler backend produces the managed assembly. Rust exports the recorded comparison."
credit = "FractalFir authors rustc_codegen_clr. My local fork covers compiler, linker, compatibility, and acceptance work."
demo_href = "/experiments/rust-dotnet/#demo"

[[experiments]]
slug = "tylax"
name = "LaTeX to Typst"
category = "languages"
status = "recorded"
summary = "Convert LaTeX mathematics to Typst with the structure intact."
interest = "A document converter has to preserve what the mathematics means as well as how it looks. Fractions, matrices, and sums put that problem in front of you: the source, converted structure, and rendered result all have to agree. My Tylax work focuses on those semantics and on the package behavior around them."
progress = "My local fork covers semantic conversion, package contracts, parser expansion, and validation. Three native conversions appear below with Typst previews. Their reports mark the artifacts Degraded because amsmath has no active handler. That package diagnostic is the next fix."
question = "How does the converted structure preserve the original mathematics?"
scope = "Three native Tylax conversions pair LaTeX source with Typst output, previews, and the converter artifact grade."
demo_plan = "Compare the source, converted text, and preview for a fraction, matrix, and sum."
next_step = "Add the amsmath handler and compare the converted documents with the converter's target compiler."
rust_plan = "The native Rust converter produces the Typst output. Typst renders the SVG previews."
credit = "SciPenAI authors Tylax. My local fork covers semantic conversion and validation."
demo_href = "/experiments/tylax/#demo"

[[experiments]]
slug = "hornet"
name = "Hornet FX desk"
category = "numbers"
status = "available"
summary = "An FX options desk that reprices the whole book as you change a trade."
interest = "A pricing formula gets interesting when you put it to work across a portfolio. Change the market, add a call or a forward, and the desk shows how the whole book reacts. I want that connection between the model and the risk to be immediate, with the inputs and calculations in the same worksheet."
progress = "The browser worksheet runs the Rust pricing engine through WebAssembly. It prices calls, puts, and forwards, supports scratch trades, and combines valuation and risk across the book. The next comparison uses the same trade and market inputs in this desk and the original coursework workbook."
question = "How does an FX options book react to a change in the market?"
scope = "The USD/MXN worksheet prices scratch trades and calculates combined portfolio risk with Rust in WebAssembly."
demo_plan = "Edit the market, add calls, puts, or forwards, and watch the portfolio totals change."
next_step = "Run the same trade and market inputs through the original workbook and the Rust engine. Compare valuation and risk totals."
rust_plan = "Rust handles pricing and risk. The browser worksheet supplies the inputs and displays the results."
credit = "Adapted from my Hornet Trading Contest coursework."
demo_href = "/projects/hornet/"

