name = "Wedeo"
category = "media"
status = "recorded"
summary = "Port FFmpeg behavior to Rust and compare the decoded bytes."
interest = "FFmpeg is a demanding reference for an AI-directed Rust rewrite because the output gives you a concrete way to judge the work. A decoded image can look right while its bytes differ. I want the port to preserve the behavior behind the picture, and byte-for-byte comparisons make that goal measurable."
