[[experiments]]
slug = "rust-target-size"
name = "Rust target size prototypes"
category = "languages"
status = "recorded"
stack = "Rust · Cargo · rustc · Wild Linker · Build Systems"
repo_url = "https://github.com/sharifhsn/rust"
summary = "Two compiler and build-system prototypes cutting Rust target/ disk usage by 61–65% via Cargo active artifact retention and 74–82% via compact rustc + Wild artifacts."
interest = "Rust target/ directories routinely balloon past 30–100 GiB across branches and feature flags. Rather than hand-waving with manual cargo clean, I built two real prototypes inside forks of cargo, rustc, and the wild linker—preserving full DWARF debug info and incremental compilation—and benchmarked both storage savings and exact rebuild costs across Bevy, Polars, Nushell, Ruff, and uv."
progress = "Track 1 (-Zactive-artifacts in Cargo) retains live build graphs and reclaims obsolete configurations, cutting target size by 61–65% across all five projects (Bevy: 100.48 GiB → 34.62 GiB) with zero warm-build invalidation across 527 commands, 71 runtime oracles, and 29 regression tests. Track 2 (compact rustc + wild artifacts) combines Zstd-compressed objects/metadata, content-addressed shared storage, direct compact-library linking in Wild, and in-memory dep-graph indexing—cutting target size by 74–82% (Polars: 8.15 GiB → 1.49 GiB)."
question = "How much disk space can Cargo, rustc, and the linker reclaim while keeping full debug info and incremental compilation intact?"
scope = "Full writeup covering both prototypes, measured storage and rebuild tables across five large Rust codebases, and direct links to every branch and reproduction script."
demo_plan = "Read the complete benchmark writeup and compare the Cargo retention and compact Wild tracks."
next_step = "Refine cross-platform active-session lifetime tracking on Windows, add full-workspace concurrency support, and upstream the findings."
rust_plan = "Implemented directly across forks of rust-lang/cargo, rust-lang/rust, and wild-linker/wild."
credit = "Built on upstream Cargo, rustc, and the Wild linker."
demo_href = "/experiments/rust-target-size/#target-size-writeup"

