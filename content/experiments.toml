question = "How does a scene pass from Bevy through wgpu to the platform backend?"
scope = "Rust transforms an original triangle and exports the result as SVG. The diagram traces the native Bevy graphics layers."
demo_plan = "Choose a rotation and inspect the vertices and renderer boundary."
next_step = "Run the triangle through a Bevy build, then compare the emulator and hardware output."
rust_plan = "Rust calculates the browser vertices and SVG. The native platform lab uses Bevy and wgpu."
credit = "Platform experiments build on upstream Bevy, wgpu, and Deko3D work."
