scope = "Three synthetic H.264 frames pass through the native Wedeo and FFmpeg decoders. Their raw YUV output matches byte for byte."
demo_plan = "Select a decoded frame and compare its checksum with the FFmpeg reference."
next_step = "Add a second decoder fixture and compare its raw output with FFmpeg."
rust_plan = "The native Rust CLI supplies the decoded output. Rust and Askama publish the frames and checksums."
credit = "Human-directed, AI-generated port based on FFmpeg references."
