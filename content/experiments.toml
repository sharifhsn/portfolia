[[experiments]]
slug = "github-triage"
name = "GitHub issue triage"
category = "tools"
status = "recorded"
summary = "Turn a bug report into a small reproduction, a verified explanation, and a useful next action."
interest = "An issue is a question about how software behaves. Answering it takes you through the source, the release history, and the conditions that make the failure happen. I enjoy that detective work. My three-line program exposed a linker defect. Comparing adjacent releases linked shipped fixes to issues they never closed. The useful result is evidence that another developer can run and check."
progress = "My public work includes uv release comparisons and workspace benchmarks, a Wild linker crash report, a Typst shaping regression, a Serena handler-lifecycle report, and Codex browser tooling reports. Upstream fixes closed several of these issues. My newer uv workspace-ownership proposal remains open. The examples below link to my published reports and comments, with issue and pull-request states checked on October 11, 2026."
question = "What evidence turns an old issue into a clear engineering decision?"
scope = "Eight selected public issues and comments show release attribution, performance measurement, minimal reproductions, and unresolved design work."
demo_plan = "Compare four investigations, follow the six-step process, and inspect a published close recommendation."
next_step = "Continue checking current behavior against the original report. For workspace cleanup, test descendant lifetimes and cancellation across platforms, then evaluate an implementation that keeps live execution files outside the disposable cache."
rust_plan = "Rust loads the public evidence snapshot, calculates benchmark ratios, and renders the SVG comparisons. Native HTML controls select the investigations."
credit = "My reports and verification comments are linked throughout. Upstream contributors authored the fixing pull requests. Codex assists with research, test harnesses, and evidence preparation."
demo_href = "/experiments/github-triage/#demo"
