[[experiments]]
slug = "tessera"
name = "Tessera"
category = "languages"
status = "study"
stack = "Rust · Window Protocol · Multi-Agent · MCP · Wayland · WASM"
featured = true
summary = "A window-system protocol and 18-crate Rust server built for AI agents: typed semantic trees committed atomically with pixels, subtree capability locks, and multi-agent concurrency on a single window."
interest = "Computer-use agents are forced to operate GUIs like blindfolded screen scrapers—guessing pixel coordinates, polling with sleeps, and colliding over one shared cursor. Tessera replaces that entire stack with one architectural idea: a window system is a single shared tree of typed nodes. Every property has one writer, changes move in atomic timed transactions, and authority is an explicit capability grant. Semantic state (roles, names, values, actions, bounds) commits in the exact same transaction as pixels, sensitive fields like passwords are blanked at the server, and multiple agents can lock disjoint subtrees of the same window with independent input seats and optimistic compare-and-swap actions."
progress = "Built and tested across an 18-crate Rust workspace (#![forbid(unsafe_code)] everywhere outside the IPC transport crate): binary wire codec, single-writer scene graph, software compositor, Unix-socket/shared-memory transport, reference tiling window manager, Wayland bridge, encrypted remote link, WebAssembly edge/visitor modules, and a native MCP server exposing list_windows, read_tree, act, type_text, capture, and wait_settled. Scripted multi-agent tests run real concurrent processes operating disjoint halves of the same window without deadlocks or cursor collisions."
question = "What does a desktop protocol look like when AI agents are first-class citizens alongside humans?"
scope = "Walk through four core protocol primitives: atomic tree + pixel commits, multi-agent subtree locks with per-seat focus, optimistic CAS clock guards, and single-writer capabilities."
demo_plan = "Switch between the four protocol primitives to inspect the exact transaction, locking, and MCP semantics."
next_step = "Connect native display and GPU backends on Linux and macOS, benchmark agent task reliability and token cost against screenshot-based computer use, and gather external protocol design feedback."
rust_plan = "Pure Rust 18-crate workspace separating protocol, wire codec, scene graph, software renderer, window manager, Wayland bridge, encrypted link, WASM edge, and MCP server."
credit = "Original window-system protocol and Rust reference implementation."
demo_href = "/experiments/tessera/#demo"

