[[experiments]]
slug = "ldsc"
name = "LD Score Regression in Rust"
category = "numbers"
status = "study"
stack = "Rust · faer · Genomics · SIMD"
featured = true
repo_url = "https://github.com/sharifhsn/ldsc"
summary = "An 18.1× faster exact Rust rewrite of Bulik-Sullivan et al.'s LDSC engine—cutting 1000G LD-score calculation from 25m 49s down to 85 seconds with 0.0 max difference."
interest = "LDSC turns published genome-wide association studies (GWAS) into reusable data for estimating SNP heritability and cross-trait genetic correlation without touching individual-level genomes. The bottleneck is calculating LD scores across millions of variants in the reference panel. Rewriting the engine in Rust with ring-buffered genotype windows and blocked faer matrix kernels makes iterating on panels, window sizes, and precision modes fast enough to run interactively."
progress = "Implements the complete LD-score, heritability, and genetic-correlation pipeline with exact f64, fast f32, and CountSketch paths. On the same workstation, exact f64 LD scores finish in 85 seconds versus 25 minutes 49 seconds in Python—an 18.1× speedup with zero maximum absolute difference. The worked BMI analysis reproduces 20.32% SNP heritability across 1.18M merged variants in 5.8 seconds end-to-end on Apple Silicon."
question = "How fast can exact genomic LD-score regression run when rewritten around cache-resident ring buffers and blocked matrix kernels?"
scope = "Inspect the 18.1× benchmark comparison, ring-buffer / f32 / CountSketch architecture diagrams, 1000G chromosome 22 distribution, and Yengo et al. BMI regression."
demo_plan = "Explore the speedups, step through the three computational optimizations, and trace the BMI heritability result."
next_step = "Benchmark CountSketch heritability accuracy across larger multi-ancestry reference panels and publish prebuilt binaries."
rust_plan = "Native Rust CLI powered by faer; Rust also generates every benchmark chart and diagram on this page."
credit = "Rust reimplementation of Bulik-Sullivan et al.'s LDSC method and reference software."
demo_href = "/experiments/ldsc/#engine"

