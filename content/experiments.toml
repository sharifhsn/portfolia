[[experiments]]
slug = "ttfx"
name = "Terminal text effects"
category = "tools"
status = "recorded"
stack = "Rust · CLI · ANSI · Negative Benchmark"
summary = "A negative result worth keeping: porting TerminalTextEffects to Rust to try to beat the original on throughput—and finding out where Rust actually lost."
interest = "Everyone posts the 'rewrote it in Rust, 18× faster' wins—like LDSC above. I also wanted to publish a genuine negative example. I ported ChrisBuilds' TerminalTextEffects into a native Rust binary expecting an easy win on startup and frame rendering, and ran head-first into a real performance regression instead."
progress = "Built the native Rust binary and captured full seeded terminal animation runs (30 frames of the print effect shown below). Profiling revealed a real throughput regression against the baseline—a good reminder that rewriting in Rust doesn't magically beat tight existing code without fixing the underlying frame-buffer and ANSI-emission architecture."
question = "What happens when a Rust rewrite doesn't beat the original—and what does the regression teach you?"
scope = "Inspect four frames captured from a 30-frame seeded native ttfx run alongside the lessons from the regression."
demo_plan = "Step through four frames of the recorded print effect."
next_step = "Profile ANSI diffing and buffer allocation to see whether a batched terminal diff closes the gap."
rust_plan = "Native Rust CLI port of TerminalTextEffects."
credit = "Ports TerminalTextEffects by ChrisBuilds (MIT license)."
