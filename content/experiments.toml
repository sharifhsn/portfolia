demo_plan = "Follow the text into a QR frame, then compare the recovered bytes and checksum."
next_step = "Display an encoded frame, capture it with a camera, and compare the recovered file with the original."
rust_plan = "The shared native Rust core encodes and decodes the file. Rust publishes the recorded frame and result."
credit = "A personal visual file-transfer experiment."
