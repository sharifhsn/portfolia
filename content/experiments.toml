[[experiments]]
slug = "volt"
name = "Volt"
category = "tools"
status = "recorded"
summary = "Transfer exact file bytes through a screen and a camera."
interest = "Two devices don't need a shared network to exchange data if one has a screen and the other has a camera. Volt uses that visual channel for file transfer. The challenge is reconstructing the original bytes from the frames the receiver gets, so the checksum matters as much as the image."
